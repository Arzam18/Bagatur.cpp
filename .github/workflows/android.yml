name: Build Bagatur Android ARM64 NEON

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Bagatur Android ARM64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build file

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Configure Android ARM64
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBAGATUR_LTO=OFF

      - name: Build UCI engine
        run: cmake --build build-android --target Bagatur.cpp-x64 --parallel 2

      - name: Verify Android binary
        run: |
          set -eux
          BIN=build-android/Bagatur.cpp_1.0-android-arm64
          test -f "$BIN"
          file "$BIN"
          readelf -h "$BIN" | tee elf-header.txt
          grep -q 'AArch64' elf-header.txt
          readelf -l "$BIN" | tee elf-program-headers.txt
          ! grep -q 'ld-linux' elf-program-headers.txt
          readelf -d "$BIN" | tee elf-dynamic.txt
          if grep -q 'libc++_shared.so' elf-dynamic.txt; then
            echo "::error::Unexpected dependency on libc++_shared.so"
            exit 1
          fi

      - name: Upload Android ARM64 executable
        uses: actions/upload-artifact@v4
        with:
          name: Bagatur.cpp-android-arm64-neon
          path: build-android/Bagatur.cpp_1.0-android-arm64
          if-no-files-found: error
